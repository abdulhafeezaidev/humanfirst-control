project_id = "rwvgeoplgctnrgnflglf"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[functions.admin-management]
verify_jwt = true

[functions.audit-logs]
verify_jwt = true

[functions.data-retention-cleanup]
verify_jwt = true

[functions.enforcement-metrics]
verify_jwt = true

# metrics-aggregator: handles on-demand requests (needs user JWT) and scheduled
# cron jobs (authenticated via x-cron-secret header inside the function).
# Gateway-level JWT is required so anonymous HTTP calls are rejected before
# the function code runs. Scheduled invocations supply their own cron secret.
[functions.metrics-aggregator]
verify_jwt = true

# data-export: high-privilege endpoint that exports ALL org data.
# Must never be callable without a valid user JWT at the gateway level.
[functions.data-export]
verify_jwt = true
